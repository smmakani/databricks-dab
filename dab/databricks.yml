# This is a Declarative Automation Bundle definition for dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab
  uuid: 16a5207b-61c6-456e-a529-266ebc703f76

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405605837733396.16.azuredatabricks.net
    variables:
      catalog: dab_tutorial
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405605837733396.16.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/shakil_makani@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shakil_makani@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_tutorial
      schema: prod
    permissions:
      - user_name: shakil_makani@hotmail.com
        level: CAN_MANAGE
